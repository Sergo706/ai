services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: ai-test-postgres
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis/redis-stack-server:latest
    container_name: ai-test-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
