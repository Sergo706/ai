name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

jobs:
  type-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Dependencies
        run: npm ci

      - name: Typecheck
        run: npx nuxt prepare && npx nuxt typecheck

      - name: Lint
        run: npm run lint

  cloudflare:
    needs: type-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_TOKEN }}
          accountId: ${{ secrets.CF_ACC_ID }}
          workingDirectory: web
          command: pages deploy .output/public --project-name ai
